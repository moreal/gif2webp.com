  <script>
    // Client-side only: on the default (English) URL, honor a saved language
    // choice — or, on a first visit, the browser's language preferences — by
    // moving to that language's URL before paint. Never redirects away from
    // an explicit language URL, and crawlers fetching the static pages never
    // run it. LANGS lists the non-default languages (the ones with a
    // /<code>/ URL); scripts/prerender.mjs fails the build if this list
    // drifts from SUPPORTED_LANGUAGES in src/config/i18n.ts.
    try {
      var LANGS = "ko ja de zh";
      var list = LANGS.split(" ");
      if (list.indexOf(location.pathname.split("/")[1]) < 0) {
        var prefs = [localStorage.getItem("gif2webp-language")]
          .concat(navigator.languages || [navigator.language || ""]);
        for (var i = 0; i < prefs.length; i++) {
          var p = (prefs[i] || "").toLowerCase().split("-")[0];
          if (p === "en") break;
          if (list.indexOf(p) >= 0) { location.replace("/" + p + "/"); break; }
        }
      }
    } catch (e) { }
  </script>

  <script>
    try {
      var stored = localStorage.getItem("gif2webp-theme");
      var theme = stored;
      if (!theme || theme === "system") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (e) {}
  </script>
