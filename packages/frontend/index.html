  <meta charset="UTF-8" />
  <script>
    // Client-side only: honor a saved language choice (or, on first visit,
    // the browser language) by moving from / to /ko/ before paint. Never
    // redirects away from an explicit language URL, and crawlers fetching
    // the static page are unaffected.
    try {
      if (!location.pathname.startsWith("/ko")) {
        var storedLang = localStorage.getItem("gif2webp-language");
        var preferredLang = storedLang || (navigator.language || "").split("-")[0];
        if (preferredLang === "ko") location.replace("/ko/");
      }
    } catch (e) { }
  </script>

<body>
  <script>
    try {
      var stored = localStorage.getItem("gif2webp-theme");
      var theme = stored;
      if (!theme || theme === "system") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (e) {}
  </script>
